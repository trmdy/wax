name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          if [[ -f rust-toolchain.toml ]]; then
            rustup show active-toolchain
          else
            rustup toolchain install stable --profile minimal
            rustup override set stable
          fi
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            harness/wax-harness -> harness/wax-harness/target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/oracle/package-lock.json

      # W1 CI deliberately does not fetch the network-heavy corpus or run the
      # local harness E2E; both remain local-only until a later wave.
      - name: Run CI checks
        run: scripts/check.sh

  macos-release-smoke:
    name: macOS release build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          if [[ -f rust-toolchain.toml ]]; then
            rustup show active-toolchain
          else
            rustup toolchain install stable --profile minimal
            rustup override set stable
          fi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release
