[workspace]
members = [
    "crates/wax-core",
    "crates/wax-fmt",
    "crates/wax-read",
    "crates/wax-write",
    "crates/wax-proto",
    "crates/wax-cli",
    "harness/wax-harness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2.174"
quick-xml = "0.38.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.20.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
